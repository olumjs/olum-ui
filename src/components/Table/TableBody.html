<script>
  import { props } from "olum";
  import { twMerge } from "tailwind-merge";

  const { class: className = "", children } = props();

  const classes = () => twMerge("table-row-group [&_[data-slot=table-row]:last-child]:border-0 [&>[data-olum]]:contents", className);
</script>

<div data-slot="table-body" role="rowgroup" class="{classes()}">{children}</div>
