<script>
  import { props, onMount } from "olum";
  import { twMerge } from "tailwind-merge";

  const { class: className = "" } = props();

  const state = { disabled: false };

  const scroller = () => {
    const root = host.closest('[data-slot="carousel"]');
    return root && root.querySelector('[data-slot="carousel-content"]');
  };

  onMount(() => {
    const el = scroller();
    if (!el) return;
    const update = () => {
      state.disabled = el.scrollLeft >= el.scrollWidth - el.clientWidth - 2;
    };
    el.addEventListener("scroll", update, { passive: true });
    const t = setTimeout(update);
    return () => {
      clearTimeout(t);
      el.removeEventListener("scroll", update);
    };
  });

  const go = () => {
    const el = scroller();
    if (el) el.scrollBy({ left: el.clientWidth + 16, behavior: "smooth" });
  };

  const classes = () =>
    twMerge(
      "absolute inset-y-0 -right-12 z-10 my-auto inline-flex size-7 touch-manipulation items-center justify-center rounded-full border border-border bg-background transition-all hover:bg-muted disabled:pointer-events-none disabled:opacity-50 [&_svg]:size-3.5",
      className,
    );
</script>

<button type="button" data-slot="carousel-next" class="{classes()}" disabled="{state.disabled}" onclick="go()">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg>
  <span class="sr-only">Next slide</span>
</button>
