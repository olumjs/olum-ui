<script>
  import { props, onMount } from "olum";
  import { twMerge } from "tailwind-merge";

  const { open = false, onOpenChange, class: className = "", children } = props();

  const dismiss = () => onOpenChange && onOpenChange(false);

  onMount(() => {
    // Items are nested inside Command/CommandList/CommandGroup slots, so a
    // callback prop on <CommandItem> can't resolve back to the opener. Close by
    // delegating from the dialog itself instead.
    const onItemClick = (e) => {
      if (e.target.closest("[data-slot=command-item]")) dismiss();
    };
    const onKey = (e) => {
      if (e.key === "Escape") dismiss();
    };

    host.addEventListener("click", onItemClick);
    document.addEventListener("keydown", onKey);
    return () => {
      host.removeEventListener("click", onItemClick);
      document.removeEventListener("keydown", onKey);
    };
  });

  const classes = () =>
    twMerge(
      "fixed top-1/3 left-1/2 z-50 w-full max-w-[calc(100%-2rem)] -translate-x-1/2 overflow-hidden rounded-xl bg-background p-0 text-sm text-foreground ring-1 ring-foreground/10 outline-none sm:max-w-sm",
      className,
    );
</script>

<if when="open">
  <div data-slot="dialog-overlay" class="fixed inset-0 z-50 bg-black/10" onclick="dismiss()"></div>
  <div data-slot="dialog-content" class="{classes()}">{children}</div>
</if>
