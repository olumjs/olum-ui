<script>
  import Switch from "../Switch/Switch";
  import Label from "../Label/Label";
  import Direction from "./Direction";
  import ButtonGroup from "../ButtonGroup/ButtonGroup";
  import Button from "../Button/Button";

  const state = { direction: "ltr" };

  const setDirection = (checked) => (state.direction = checked ? "rtl" : "ltr");

  const arrowRight = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" /></svg>`;
</script>

<div class="flex flex-col gap-3">
  <div class="flex items-center gap-2">
    <Switch id="dir-switch" onCheckedChange="{setDirection}" />
    <Label for="dir-switch">Right-to-left</Label>
  </div>
  <Direction direction="{state.direction}">
    <ButtonGroup>
      <Button variant="outline">
        <div data-icon="inline-start" html="arrowRight"></div> First
      </Button>
      <Button variant="outline">Second</Button>
      <Button variant="outline">Third</Button>
    </ButtonGroup>
  </Direction>
</div>
