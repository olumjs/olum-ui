<script>
  import { props } from "olum";
  import { twMerge } from "tailwind-merge";

  const { selected, onSelect, class: className = "" } = props();

  const now = new Date();
  const state = { year: now.getFullYear(), month: now.getMonth(), sel: typeof selected === "number" ? selected : null };

  const weekdays = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];

  const label = () => new Date(state.year, state.month, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });

  const cells = () => {
    const first = new Date(state.year, state.month, 1);
    const start = new Date(state.year, state.month, 1 - first.getDay());
    const out = [];
    for (let i = 0; i < 42; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      out.push({
        ts: d.getTime(),
        day: d.getDate(),
        outside: d.getMonth() !== state.month,
        today: d.toDateString() === new Date().toDateString(),
      });
    }
    return out;
  };

  const prev = () => {
    const d = new Date(state.year, state.month - 1, 1);
    state.year = d.getFullYear();
    state.month = d.getMonth();
  };
  const next = () => {
    const d = new Date(state.year, state.month + 1, 1);
    state.year = d.getFullYear();
    state.month = d.getMonth();
  };

  const pick = (cell) => {
    state.sel = cell.ts;
    onSelect && onSelect(new Date(cell.ts));
  };

  const dayClasses = (cell) => {
    const base = "flex size-7 cursor-pointer items-center justify-center rounded-md text-sm font-normal select-none transition-colors hover:bg-muted";
    if (state.sel === cell.ts) return twMerge(base, "bg-primary text-primary-foreground hover:bg-primary/80");
    if (cell.today) return twMerge(base, "bg-muted text-foreground");
    if (cell.outside) return twMerge(base, "text-muted-foreground");
    return base;
  };

  const classes = () => twMerge("w-fit bg-background p-2", className);
</script>

<div data-slot="calendar" class="{classes()}">
  <div class="flex items-center justify-between gap-1 pb-2">
    <button type="button" class="inline-flex size-7 items-center justify-center rounded-lg text-foreground transition-colors hover:bg-muted" onclick="prev()">
      <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6" /></svg>
      <span class="sr-only">Previous month</span>
    </button>
    <div class="text-sm font-medium select-none">{label()}</div>
    <button type="button" class="inline-flex size-7 items-center justify-center rounded-lg text-foreground transition-colors hover:bg-muted" onclick="next()">
      <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg>
      <span class="sr-only">Next month</span>
    </button>
  </div>
  <div class="grid grid-cols-7">
    <for each="wd of weekdays" key="wd">
      <div class="flex size-7 items-center justify-center text-[0.8rem] font-normal text-muted-foreground select-none">{wd}</div>
    </for>
  </div>
  <div class="mt-1 grid grid-cols-7 gap-y-1">
    <for each="cell of cells()" key="cell.ts">
      <button type="button" class="{dayClasses(cell)}" onclick="pick(cell)">{cell.day}</button>
    </for>
  </div>
</div>
