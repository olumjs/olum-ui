<script>
  import { props } from "olum";
  import { twMerge } from "tailwind-merge";

  // `props()` returns a live proxy, so `selected` is read through `p` on every
  // render instead of being destructured once at setup -- that is what lets a
  // parent change `selected` later and have the grid follow it.
  const p = props();
  const { onchange, class: className = "" } = p;

  const weekdays = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];

  // Midnight (local) of a date -- the grid cells are built the same way, so
  // comparing these two is a day comparison, not a clock comparison.
  const dayTs = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();

  // `selected` accepts a Date, an epoch number, "YYYY-MM-DD" or any parsable
  // date string. Props travel through JSON, so a Date given by a parent arrives
  // here as an ISO string -- that is the `new Date(s)` branch below.
  const toTs = (val) => {
    if (val === null || val === undefined || val === "") return null;
    if (val instanceof Date) return isNaN(val.getTime()) ? null : dayTs(val);
    if (typeof val === "number") {
      const d = new Date(val);
      return isNaN(d.getTime()) ? null : dayTs(d);
    }
    if (typeof val === "string") {
      const s = val.trim();
      // Date-only strings are UTC per the spec; build them locally instead so
      // they can't land on the previous day west of Greenwich.
      const ymd = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
      if (ymd) return new Date(+ymd[1], +ymd[2] - 1, +ymd[3]).getTime();
      const d = new Date(s);
      return isNaN(d.getTime()) ? null : dayTs(d);
    }
    return null;
  };

  // `ts` is what the user clicked; `propAtPick` is the value of `selected` at
  // that moment. If the prop moved since then, the parent is the newer source
  // of truth and wins. Nothing below writes to state while rendering.
  const state = { ts: undefined, propAtPick: undefined, nav: null, navRef: undefined };

  const selectedTs = () => {
    const t = toTs(p.selected);
    if (state.ts === undefined) return t;
    if (t !== state.propAtPick) return t;
    return state.ts;
  };

  // The month on screen: wherever the user navigated to, unless the selection
  // changed after that -- then it follows the selection (or today, if none).
  const view = () => {
    const cur = selectedTs();
    if (state.nav && state.navRef === cur) return state.nav;
    const d = cur === null ? new Date() : new Date(cur);
    return { year: d.getFullYear(), month: d.getMonth() };
  };

  const label = () => {
    const v = view();
    return new Date(v.year, v.month, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });
  };

  const cells = () => {
    const v = view();
    const cur = selectedTs();
    const first = new Date(v.year, v.month, 1);
    const start = new Date(v.year, v.month, 1 - first.getDay());
    const out = [];
    for (let i = 0; i < 42; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      out.push({
        ts: d.getTime(),
        day: d.getDate(),
        outside: d.getMonth() !== v.month,
        today: d.toDateString() === new Date().toDateString(),
        selected: d.getTime() === cur,
      });
    }
    return out;
  };

  const goTo = (delta) => {
    const v = view();
    const d = new Date(v.year, v.month + delta, 1);
    state.navRef = selectedTs();
    state.nav = { year: d.getFullYear(), month: d.getMonth() };
  };

  const prev = () => goTo(-1);
  const next = () => goTo(1);

  const pick = (cell) => {
    state.propAtPick = toTs(p.selected);
    state.ts = cell.ts;
    onchange && onchange(new Date(cell.ts));
  };

  // Plain native <button>s (not the shared Button component) -- reading
  // `class="{dayClasses(cell)}"` directly as part of Calendar's own render,
  // with no cross-component prop-passing in between, so there's no separate
  // reactivity layer that could fail to propagate an updated class into a
  // keyed list item. The hover/focus/active treatment below is copied from
  // Button's own "ghost" variant to keep the same look and feel.
  const navBtn =
    "inline-flex size-7 cursor-pointer items-center justify-center rounded-lg border border-transparent text-foreground outline-none select-none hover:bg-muted hover:text-foreground focus:border-ring focus:ring-3 focus:ring-ring/50 active:translate-y-px";

  const dayBase =
    "inline-flex size-7 cursor-pointer items-center justify-center rounded-lg border border-transparent text-sm font-medium outline-none select-none hover:bg-muted focus:border-ring focus:ring-3 focus:ring-ring/50 active:translate-y-px";

  const dayClasses = (cell) => {
    if (cell.selected) return twMerge(dayBase, "bg-primary text-primary-foreground hover:bg-primary/80");
    if (cell.today) return twMerge(dayBase, "bg-muted text-foreground");
    if (cell.outside) return twMerge(dayBase, "text-muted-foreground");
    return dayBase;
  };

  const classes = () => twMerge("w-fit bg-background p-2", className);
</script>

<div data-slot="calendar" class="{classes()}">
  <div class="flex items-center justify-between gap-1 pb-2">
    <button type="button" class="{navBtn}" onclick="prev()">
      <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6" /></svg>
      <span class="sr-only">Previous month</span>
    </button>
    <div class="text-sm font-medium select-none">{label()}</div>
    <button type="button" class="{navBtn}" onclick="next()">
      <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg>
      <span class="sr-only">Next month</span>
    </button>
  </div>
  <div class="grid grid-cols-7">
    <for each="wd of weekdays" key="wd">
      <div class="flex size-7 items-center justify-center text-[0.8rem] font-normal text-muted-foreground select-none">{wd}</div>
    </for>
  </div>
  <div class="mt-1 grid grid-cols-7 gap-y-1">
    <for each="cell of cells()" key="cell.ts">
      <button type="button" class="{dayClasses(cell)}" onclick="pick(cell)">{cell.day}</button>
    </for>
  </div>
</div>
