<script>
  import Input from "../../components/ui/Input/Input";
  import Navbar from "../../components/Navbar/Navbar";
  import GalleryNav from "../../components/GalleryNav/GalleryNav";
  import PageToc from "../../components/PageToc/PageToc";
  import Pager from "../../components/Pager/Pager";
  import DemoBlock from "../../components/DemoBlock/DemoBlock";
  import InstallBlock from "../../components/InstallBlock/InstallBlock";
  import PageHeader from "../../components/PageHeader/PageHeader";
  import { snippets } from "./snippets";

  const state = { log: "Type, focus, or blur the input" };
  const onInputInput = (e) => (state.log = "oninput: " + e.target.value);
  const onInputChange = (e) => (state.log = "onchange: " + e.target.value);
  const onInputFocus = () => (state.log = "onfocus");
  const onInputBlur = () => (state.log = "onblur");
</script>

<Navbar />
<GalleryNav id="input" />
<PageToc snippets="{snippets}" />

<div class="mx-auto flex max-w-4xl flex-col gap-10 p-6 sm:p-10">
  <PageHeader id="input" />

  
  <DemoBlock label="states" snippet="{snippets['states']}">
    <Input placeholder="Enter text" />
    <Input placeholder="Error" invalid="{true}" />
    <Input placeholder="Disabled" disabled="{true}" />
  </DemoBlock>
  
  <InstallBlock id="input" />
  <DemoBlock label="password" snippet="{snippets['password']}">
    <Input type="password" placeholder="Password" />
  </DemoBlock>

  <DemoBlock label="events" snippet="{snippets['events']}">
    <div class="flex w-56 flex-col gap-3">
      <Input placeholder="Type here" oninput="{onInputInput}" onchange="{onInputChange}" onfocus="{onInputFocus}" onblur="{onInputBlur}" />
      <p class="text-sm text-muted-foreground">{state.log}</p>
    </div>
  </DemoBlock>

  <Pager id="input" />
</div>
