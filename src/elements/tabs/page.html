<script>
  import Tabs from "../../components/ui/Tabs/Tabs";
  import TabsList from "../../components/ui/Tabs/TabsList";
  import TabsTrigger from "../../components/ui/Tabs/TabsTrigger";
  import TabsContent from "../../components/ui/Tabs/TabsContent";
  import Navbar from "../../components/Navbar/Navbar";
  import GalleryNav from "../../components/GalleryNav/GalleryNav";
  import PageToc from "../../components/PageToc/PageToc";
  import Pager from "../../components/Pager/Pager";
  import DemoBlock from "../../components/DemoBlock/DemoBlock";
  import InstallBlock from "../../components/InstallBlock/InstallBlock";
  import PageHeader from "../../components/PageHeader/PageHeader";
  import { snippets } from "./snippets";

  const state = { log: "Pick a tab" };
  const onTabsTriggerChange = (value) => (state.log = "onchange: " + value);
</script>

<Navbar />
<GalleryNav id="tabs" />
<PageToc snippets="{snippets}" />

<div class="mx-auto flex max-w-4xl flex-col gap-10 p-6 sm:p-10">
  <PageHeader id="tabs" />


  <DemoBlock label="default" snippet="{snippets['default']}">
    <Tabs class="w-72">
      <TabsList>
        <TabsTrigger group="tabs1" value="account" defaultChecked="{true}">Account</TabsTrigger>
        <TabsTrigger group="tabs1" value="password">Password</TabsTrigger>
      </TabsList>
      <TabsContent value="account">Manage your account settings.</TabsContent>
      <TabsContent value="password">Change your password.</TabsContent>
    </Tabs>
  </DemoBlock>

  <InstallBlock id="tabs" />
  <DemoBlock label="line variant" snippet="{snippets['line-variant']}">
    <Tabs class="w-72">
      <TabsList variant="line">
        <TabsTrigger group="tabs2" variant="line" value="overview" defaultChecked="{true}">Overview</TabsTrigger>
        <TabsTrigger group="tabs2" variant="line" value="analytics">Analytics</TabsTrigger>
      </TabsList>
      <TabsContent value="overview">Overview content.</TabsContent>
      <TabsContent value="analytics">Analytics content.</TabsContent>
    </Tabs>
  </DemoBlock>

  <DemoBlock label="events" snippet="{snippets['events']}">
    <div class="flex flex-col gap-3">
      <Tabs class="w-72">
        <TabsList>
          <TabsTrigger group="tabs3" value="account" defaultChecked="{true}" onchange="{onTabsTriggerChange}">Account</TabsTrigger>
          <TabsTrigger group="tabs3" value="password" onchange="{onTabsTriggerChange}">Password</TabsTrigger>
        </TabsList>
        <TabsContent value="account">Manage your account settings.</TabsContent>
        <TabsContent value="password">Change your password.</TabsContent>
      </Tabs>
      <p class="text-sm text-muted-foreground">{state.log}</p>
    </div>
  </DemoBlock>

  <Pager id="tabs" />
</div>
