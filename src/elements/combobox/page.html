<script>
  import Combobox from "../../components/ui/Combobox/Combobox";
  import Navbar from "../../components/Navbar/Navbar";
  import GalleryNav from "../../components/GalleryNav/GalleryNav";
  import PageToc from "../../components/PageToc/PageToc";
  import Pager from "../../components/Pager/Pager";
  import DemoBlock from "../../components/DemoBlock/DemoBlock";
  import InstallBlock from "../../components/InstallBlock/InstallBlock";
  import PageHeader from "../../components/PageHeader/PageHeader";
  import { snippets } from "./snippets";

  const fruits = ["Apple", "Banana", "Cherry", "Date", "Elderberry", "Fig", "Grape"];

  const state = { log: "Search and pick a fruit, or clear it" };
  const onComboboxChange = (value) => (state.log = "onchange: " + value);
  const onComboboxClear = () => (state.log = "onclear");
</script>

<Navbar />
<GalleryNav id="combobox" />
<PageToc snippets="{snippets}" />

<div class="mx-auto flex max-w-4xl flex-col gap-10 p-6 sm:p-10">
  <PageHeader id="combobox" />

  
  <DemoBlock label="default" snippet="{snippets['default']}" previewClass="min-h-50 items-start">
    <Combobox items="{fruits}" placeholder="Search fruit…" showClear="{true}" emptyText="No fruit found." class="w-56" />
  </DemoBlock>
  
  <InstallBlock id="combobox" />

  <DemoBlock label="events" snippet="{snippets['events']}" previewClass="min-h-50 items-start">
    <div class="flex flex-col gap-3">
      <Combobox
        items="{fruits}"
        placeholder="Search fruit…"
        showClear="{true}"
        emptyText="No fruit found."
        class="w-56"
        onchange="{onComboboxChange}"
        onclear="{onComboboxClear}"
      />
      <p class="text-sm text-muted-foreground">{state.log}</p>
    </div>
  </DemoBlock>

  <Pager id="combobox" />
</div>
