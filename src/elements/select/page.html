<script>
  import Select from "../../components/ui/Select/Select";
  import SelectTrigger from "../../components/ui/Select/SelectTrigger";
  import SelectValue from "../../components/ui/Select/SelectValue";
  import SelectContent from "../../components/ui/Select/SelectContent";
  import SelectGroup from "../../components/ui/Select/SelectGroup";
  import SelectLabel from "../../components/ui/Select/SelectLabel";
  import SelectItem from "../../components/ui/Select/SelectItem";
  import SelectSeparator from "../../components/ui/Select/SelectSeparator";
  import Navbar from "../../components/Navbar/Navbar";
  import GalleryNav from "../../components/GalleryNav/GalleryNav";
  import PageToc from "../../components/PageToc/PageToc";
  import Pager from "../../components/Pager/Pager";
  import DemoBlock from "../../components/DemoBlock/DemoBlock";
  import InstallBlock from "../../components/InstallBlock/InstallBlock";
  import PageHeader from "../../components/PageHeader/PageHeader";
  import { snippets } from "./snippets";

  const state = { log: "Pick a fruit" };
  const onSelectChange = (value) => (state.log = "onchange: " + value);
</script>

<Navbar />
<GalleryNav id="select" />
<PageToc snippets="{snippets}" />

<div class="mx-auto flex max-w-4xl flex-col gap-10 p-6 sm:p-10">
  <PageHeader id="select" />


  <DemoBlock label="default" snippet="{snippets['default']}">
    <Select defaultValue="apple">
      <SelectTrigger class="w-48">
        <SelectValue placeholder="Select a fruit" />
      </SelectTrigger>
      <SelectContent>
        <SelectGroup>
          <SelectLabel>Fruits</SelectLabel>
          <SelectItem value="apple">Apple</SelectItem>
          <SelectItem value="banana">Banana</SelectItem>
        </SelectGroup>
        <SelectSeparator />
        <SelectGroup>
          <SelectLabel>Vegetables</SelectLabel>
          <SelectItem value="carrot">Carrot</SelectItem>
        </SelectGroup>
      </SelectContent>
    </Select>
  </DemoBlock>

  <InstallBlock id="select" />

  <DemoBlock label="events" snippet="{snippets['events']}">
    <div class="flex flex-col gap-3">
      <Select defaultValue="apple" onchange="{onSelectChange}">
        <SelectTrigger class="w-48">
          <SelectValue placeholder="Select a fruit" />
        </SelectTrigger>
        <SelectContent>
          <SelectItem value="apple">Apple</SelectItem>
          <SelectItem value="banana">Banana</SelectItem>
          <SelectItem value="carrot">Carrot</SelectItem>
        </SelectContent>
      </Select>
      <p class="text-sm text-muted-foreground">{state.log}</p>
    </div>
  </DemoBlock>

  <Pager id="select" />
</div>
